name: Checks

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  lint:
    name: 'Lint'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Lint
        continue-on-error: true
        run: yarn lint -f @microsoft/sarif -o eslint-results.sarif
        env:
          GITHUB_SCHEMA_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4.38.0
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true

  prettier:
    name: 'Prettier'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Prettier
        run: yarn format:check

  unit-tests:
    name: 'Unit tests'
    runs-on: 'ubuntu-latest'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Create Neon branch
        uses: neondatabase/create-branch-action@v6
        id: create-branch
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ case(github.event_name == 'push', 'production', format('preview/{0}', github.head_ref)) }}
          role: neondb_owner
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Generate Prisma client
        run: yarn prisma generate
        env:
          DATABASE_URL_UNPOOLED: '${{ steps.create-branch.outputs.db_url }}'

      - name: Install Playwright browsers
        run: yarn playwright install chromium --with-deps

      - name: Run tests
        run: yarn test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          flags: unit
          use_oidc: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: junit-report.xml
          flags: unit
          use_oidc: true
