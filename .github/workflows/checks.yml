name: Checks

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  lint:
    name: 'Lint'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Lint
        continue-on-error: true
        run: yarn lint -f @microsoft/sarif -o eslint-results.sarif
        env:
          GITHUB_SCHEMA_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4.38.0
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true

  prettier:
    name: 'Prettier'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Prettier
        run: yarn format:check

  prisma-generate:
    name: 'Generate Prisma client'
    runs-on: 'ubuntu-latest'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Create Neon branch
        uses: neondatabase/create-branch-action@v6
        id: create-branch
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ case(github.event_name == 'push', 'production', format('preview/{0}', github.head_ref)) }}
          role: neondb_owner
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Generate Prisma client
        run: yarn prisma generate
        env:
          DATABASE_URL_UNPOOLED: '${{ steps.create-branch.outputs.db_url }}'

      - name: Upload generated Prisma client
        uses: actions/upload-artifact@v7
        with:
          name: 'prisma-client'
          path: 'lib/prisma'
          retention-days: 1

  unit-tests:
    name: 'Unit tests'
    runs-on: 'ubuntu-latest'
    needs: [prisma-generate]

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Download generated Prisma client
        uses: actions/download-artifact@v8
        with:
          name: 'prisma-client'
          path: 'lib/prisma'

      - name: Run tests
        run: yarn test --coverage --project=unit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          flags: unit
          use_oidc: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: junit-report.xml
          flags: unit
          report_type: test_results
          use_oidc: true

  interaction-tests:
    name: 'Interaction tests'
    runs-on: 'ubuntu-latest'
    needs: [prisma-generate]

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Download generated Prisma client
        uses: actions/download-artifact@v8
        with:
          name: 'prisma-client'
          path: 'lib/prisma'

      - name: Install Playwright browsers
        run: yarn playwright install chromium --with-deps

      - name: Run tests
        run: yarn test --coverage --project=storybook

      - name: Run Chromatic
        uses: chromaui/action@v18.9.5
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true
          externals: app/theme.css

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          flags: storybook
          use_oidc: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: junit-report.xml
          flags: storybook
          report_type: test_results
          use_oidc: true

  visual-tests:
    name: 'Visual tests'
    runs-on: 'ubuntu-latest'
    needs: [prisma-generate]

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Download generated Prisma client
        uses: actions/download-artifact@v8
        with:
          name: 'prisma-client'
          path: 'lib/prisma'

      - name: Run Chromatic
        uses: chromaui/action@v18.9.5
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true
          externals: app/theme.css
        env:
          CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.ref }}
          CHROMATIC_SLUG: ${{ github.repository }}
